# Two scheduler threads: one runs the dispatch tick (DispatchService.tick), the other the live feed
# (LiveFeed.broadcast). Spring's default is ONE thread for all @Scheduled methods, so a screen whose connection
# freezes would otherwise delay dispatch.
spring.task.scheduling.pool.size=2

# The database. ${NAME:default} reads the environment variable NAME, or uses the default: on a server set DB_URL,
# DB_USERNAME and DB_PASSWORD; on a laptop the defaults reach the local database from docker-compose.yml
# ("docker compose up -d" before starting the app). Tests replace all three with the test container's address
# (TestDatabaseConfig).
# ponytail: local-dev defaults are packaged in the jar; drop them when the whole stack gets its own compose file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/medidispatch}
spring.datasource.username=${DB_USERNAME:medidispatch}
spring.datasource.password=${DB_PASSWORD:medidispatch}

# Flyway owns the schema (db/migration). Hibernate only CHECKS at startup that every @Entity matches its table,
# and refuses to start if not; it never creates or changes a table.
spring.jpa.hibernate.ddl-auto=validate

# Do not keep a database session open for the whole web request (Boot's default, and it warns about it):
# every query should happen inside DispatchService, never by accident while JSON is being written.
spring.jpa.open-in-view=false

# Road routing: the graph built by ImportBangalore (dispatch-routing). Relative paths are tried from the working folder
# and from one folder up (IntelliJ often starts the service inside dispatch-service/). Missing or blank: routing falls
# back to straight lines at 40 km/h, with a warning at startup (fresh checkouts, CI and the tests run that way).
medidispatch.routing.graph-file=data/bangalore.graph
